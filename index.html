<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KajLagbe</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #222;
}

header {
    background: #123c69;
    color: white;
    padding: 22px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 30px;
}

.hero {
    text-align: center;
    padding: 55px 20px;
}

.hero h2 {
    color: #123c69;
    font-size: 28px;
}

.hero p {
    color: #666;
}

input {
    width: 90%;
    max-width: 400px;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
}

button {
    padding: 14px 25px;
    background: #16a36a;
    color: white;
    border: none;
    border-radius: 8px;
    margin-top: 12px;
}

.services {
    text-align: center;
    padding: 25px;
}

.card {
    background: white;
    padding: 25px;
    margin: 15px auto;
    max-width: 400px;
    border-radius: 12px;
    box-shadow: 0 2px 10px #ddd;
}

footer {
    background: #123c69;
    color: white;
    text-align: center;
    padding: 20px;
}
</style>
</head>

<body>

<header>
    <h1>KajLagbe</h1>
    <p>Find Local Jobs and Services</p>
</header>

<section class="hero">
    <h2>Find Your Dream Job!</h2>
    <p>Find jobs and services near you.</p>

    <input type="text" placeholder="Search for jobs...">
    <br>
    <button>Search Jobs</button>
</section>

<section class="services">
    <h2>Our Services</h2>

    <div class="card">
        <h3>💼 Find Jobs</h3>
        <p>Discover local job opportunities.</p>
    </div>

    <div class="card">
        <h3>🛠️ Find Services</h3>
        <p>Find trusted local services.</p>
    </div>

    <div class="card">
        <h3>👤 Create Account</h3>
        <p>Join KajLagbe today.</p>
    </div>
</section>

<footer>
    <p>© 2026 KajLagbe</p>
</footer>

</body>
</html>
